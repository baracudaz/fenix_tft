repos:
- repo: local
  hooks:
    # Ruff version comes from requirements.txt (installed via `make install`),
    # so there is a single place to bump it instead of a separate pin here.
    - id: ruff-check
      name: ruff check
      entry: ruff check --fix
      language: system
      types: [python]
    - id: ruff-format
      name: ruff format
      entry: ruff format
      language: system
      types_or: [python, markdown]
